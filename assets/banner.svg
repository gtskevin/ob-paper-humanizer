      }
    </style>
  </defs>
  <rect class="bg" width="800" height="200" rx="16" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="4" rx="2" fill="#6366f1"/>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
